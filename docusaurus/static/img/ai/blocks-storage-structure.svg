<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1440 500" preserveAspectRatio="xMidYMin meet" role="img" aria-labelledby="title desc">
  <title id="title">Blocks storage folder structure</title>
  <desc id="desc">Directory tree for Brizy AI blocks on S3 or CDN</desc>
  <defs>
    <style>
      .folder { fill: #ebf8ff; stroke: #2b6cb0; stroke-width: 1.5; }
      .file { fill: #f7fafc; stroke: #4a5568; stroke-width: 1.5; }
      .root { fill: #e6fffa; stroke: #319795; stroke-width: 2; }
      .text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #1a202c; }
      .label { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; }
      .line { stroke: #a0aec0; stroke-width: 1.25; }
      .legend-box { fill: #fff; stroke: #e2e8f0; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Branch centers: 120, 420, 720, 1020, 1320 -->
  <rect class="root" x="640" y="16" width="160" height="40" rx="6"/>
  <text class="text" x="720" y="42" text-anchor="middle">blocks/</text>

  <!-- Horizontal bar only between outermost branches -->
  <line class="line" x1="720" y1="56" x2="720" y2="76"/>
  <line class="line" x1="120" y1="76" x2="1320" y2="76"/>
  <line class="line" x1="120" y1="76" x2="120" y2="96"/>
  <line class="line" x1="420" y1="76" x2="420" y2="96"/>
  <line class="line" x1="720" y1="76" x2="720" y2="96"/>
  <line class="line" x1="1020" y1="76" x2="1020" y2="96"/>
  <line class="line" x1="1320" y1="76" x2="1320" y2="96"/>

  <!-- kits -->
  <rect class="folder" x="50" y="96" width="140" height="36" rx="6"/>
  <text class="text" x="120" y="119" text-anchor="middle">kits/</text>
  <line class="line" x1="120" y1="132" x2="120" y2="152"/>
  <rect class="folder" x="50" y="152" width="140" height="36" rx="6"/>
  <text class="text" x="120" y="175" text-anchor="middle">default/</text>
  <line class="line" x1="120" y1="188" x2="120" y2="208"/>
  <rect class="file" x="25" y="208" width="190" height="36" rx="6"/>
  <text class="text" x="120" y="231" text-anchor="middle">catalog.json</text>
  <text class="label" x="120" y="258" text-anchor="middle">block index</text>

  <!-- html -->
  <rect class="folder" x="350" y="96" width="140" height="36" rx="6"/>
  <text class="text" x="420" y="119" text-anchor="middle">html/</text>
  <line class="line" x1="420" y1="132" x2="420" y2="152"/>
  <rect class="folder" x="335" y="152" width="170" height="36" rx="6"/>
  <text class="text" x="420" y="175" text-anchor="middle">{kit_slug}/</text>
  <line class="line" x1="420" y1="188" x2="420" y2="208"/>
  <rect class="file" x="290" y="208" width="260" height="36" rx="6"/>
  <text class="text" x="420" y="231" text-anchor="middle">{collection_item_id}</text>
  <text class="label" x="420" y="258" text-anchor="middle">compiled HTML</text>

  <!-- assets -->
  <rect class="folder" x="650" y="96" width="140" height="36" rx="6"/>
  <text class="text" x="720" y="119" text-anchor="middle">assets/</text>
  <line class="line" x1="720" y1="132" x2="720" y2="152"/>
  <rect class="folder" x="635" y="152" width="170" height="36" rx="6"/>
  <text class="text" x="720" y="175" text-anchor="middle">{kit_slug}/</text>
  <line class="line" x1="720" y1="188" x2="720" y2="208"/>
  <rect class="file" x="590" y="208" width="260" height="36" rx="6"/>
  <text class="text" x="720" y="231" text-anchor="middle">{collection_item_id}</text>
  <text class="label" x="720" y="258" text-anchor="middle">scripts and styles</text>

  <!-- json -->
  <rect class="folder" x="950" y="96" width="140" height="36" rx="6"/>
  <text class="text" x="1020" y="119" text-anchor="middle">json/</text>
  <line class="line" x1="1020" y1="132" x2="1020" y2="152"/>
  <rect class="folder" x="935" y="152" width="170" height="36" rx="6"/>
  <text class="text" x="1020" y="175" text-anchor="middle">{kit_slug}/</text>
  <line class="line" x1="1020" y1="188" x2="1020" y2="208"/>
  <rect class="file" x="920" y="208" width="200" height="36" rx="6"/>
  <text class="text" x="1020" y="231" text-anchor="middle">{block_slug}</text>
  <text class="label" x="1020" y="258" text-anchor="middle">editor JSON</text>

  <!-- styles -->
  <rect class="folder" x="1250" y="96" width="140" height="36" rx="6"/>
  <text class="text" x="1320" y="119" text-anchor="middle">styles/</text>
  <line class="line" x1="1320" y1="132" x2="1320" y2="168"/>
  <rect class="file" x="1240" y="168" width="160" height="36" rx="6"/>
  <text class="text" x="1320" y="191" text-anchor="middle">{kit_slug}.json</text>
  <text class="label" x="1320" y="218" text-anchor="middle">kit global styles</text>

  <rect class="legend-box" x="40" y="300" width="1360" height="142" rx="8"/>
  <text class="label" x="64" y="332">kit_slug</text>
  <text class="text" x="238" y="332">- Kit id from export (e.g. 19562563)</text>
  <text class="label" x="64" y="362">collection_item_id</text>
  <text class="text" x="238" y="362">- Numeric id from catalog entry id</text>
  <text class="label" x="64" y="392">block_slug</text>
  <text class="text" x="238" y="392">- Slug from catalog (e.g. block5170dark)</text>
  <text class="label" x="64" y="422">One section per export page</text>
  <text class="text" x="238" y="422">- Required when building custom blocks</text>
</svg>
