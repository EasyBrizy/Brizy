<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 120" role="img" aria-labelledby="title desc">
  <title id="title">Custom form integration flow</title>
  <desc id="desc">Flow from custom form through AI Builder API to project ID, page generation, Brizy project, and editor</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#4a5568"/>
    </marker>
    <style>
      .box { fill: #f7fafc; stroke: #2d3748; stroke-width: 2; rx: 8; }
      .box-accent { fill: #ebf8ff; stroke: #2b6cb0; stroke-width: 2; }
      .label { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; font-size: 13px; fill: #1a202c; font-weight: 600; }
      .arrow { stroke: #4a5568; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <!-- boxes: x positions spaced for 6 nodes -->
  <rect class="box" x="10" y="35" width="150" height="35"/>
  <text class="label" x="85" y="58" text-anchor="middle">Your custom form</text>

  <rect class="box-accent" x="190" y="35" width="150" height="35"/>
  <text class="label" x="265" y="58" text-anchor="middle">AI Builder API</text>

  <rect class="box" x="370" y="35" width="130" height="35"/>
  <text class="label" x="435" y="58" text-anchor="middle">PROJECT ID</text>

  <rect class="box" x="530" y="35" width="150" height="35"/>
  <text class="label" x="605" y="58" text-anchor="middle">Generate Pages</text>

  <rect class="box" x="710" y="35" width="130" height="35"/>
  <text class="label" x="775" y="58" text-anchor="middle">Session project</text>

  <rect class="box-accent" x="870" y="35" width="100" height="35"/>
  <text class="label" x="920" y="58" text-anchor="middle">Editor</text>

  <!-- arrows -->
  <line class="arrow" x1="160" y1="54" x2="188" y2="54"/>
  <line class="arrow" x1="340" y1="54" x2="368" y2="54"/>
  <line class="arrow" x1="500" y1="54" x2="528" y2="54"/>
  <line class="arrow" x1="680" y1="54" x2="708" y2="54"/>
  <line class="arrow" x1="840" y1="54" x2="868" y2="54"/>
</svg>
